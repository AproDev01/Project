<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PageWeb | Modern Design</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>
  <header class="navbar">
    <div class="logo">PageWeb</div>
    <nav class="menu">
      <ul>
        <li><a href="#"><ion-icon name="home-outline"></ion-icon> Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#"><ion-icon name="call-outline"></ion-icon> Contact</a></li>
      </ul>
    </nav>
    <div class="search">
      <input type="text" placeholder="Search..." />
      <button><ion-icon name="search-outline"></ion-icon></button>
    </div>
  </header>

  <section class="hero">
    <div class="hero-content">
      <h1>Web Design & <span>Development</span></h1>
      <p>Welcome to your professional web design course. Learn, build, and grow your skills.</p>
      <button class="btn-primary">Join Us</button>
    </div>

    <div class="login-card">
      <h2>Login</h2>
      <form>
        <input type="email" placeholder="Enter your email" required />
        <input type="password" placeholder="Enter your password" required />
        <button type="submit" class="btn-login">Login</button>
        <p class="signup-text">Don't have an account? <a href="#">Sign Up</a></p>
      </form>

      <div class="social-login">
        <p>Or login with</p>
        <div class="social-icons">
          <a href="#"><ion-icon name="logo-facebook"></ion-icon></a>
          <a href="#"><ion-icon name="logo-twitter"></ion-icon></a>
          <a href="#"><ion-icon name="logo-instagram"></ion-icon></a>
          <a href="#"><ion-icon name="logo-google"></ion-icon></a>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
